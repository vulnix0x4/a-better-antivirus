version: 2

project_name: a-better-antivirus

builds:
  - id: aba
    main: ./cmd/aba
    binary: aba
    env: [CGO_ENABLED=0]
    goos: [windows]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags: ["-s -w -X main.version={{.Tag}}"]
    # ABA-Setup.exe, the click-through installer, carries both aba.exe files.
    # Each build hands its finished binary to installer/build; the second one
    # to arrive compiles the installer (Inno Setup) into dist/installer. So the
    # installer holds the same bytes as the aba_<tag>_windows_<arch>.exe
    # downloads, and it exists before the checksums are made and signed.
    hooks:
      post:
        - cmd: go run ./installer/build -arch {{ .Arch }} -bin "{{ .Path }}" -version {{ .Tag }}
          # `go run` must build for this machine, not for the target above.
          env: [GOOS=, GOARCH=]
          output: true

archives:
  # Plain .exe downloads: the simplest thing to double-click.
  - id: exe
    formats: [binary]
    name_template: "aba_{{ .Tag }}_windows_{{ .Arch }}"
  - id: zip
    formats: [zip]
    name_template: "aba_{{ .Tag }}_windows_{{ .Arch }}"
    files: [README.md, LICENSE]

checksum:
  name_template: "SHA256SUMS.txt"
  algorithm: sha256
  # The installer's hash goes in the same signed list as everything else.
  extra_files:
    - glob: ./dist/installer/ABA-Setup.exe

# Sign the checksum list with the release key (ed25519). ABA's auto-updater
# refuses any release whose SHA256SUMS.txt signature doesn't verify.
signs:
  - id: checksums
    artifacts: checksum
    cmd: go
    args: ["run", "./scripts/sign", "${artifact}", "${signature}"]
    signature: "${artifact}.sig"

release:
  # No version in the name: the website links to
  # releases/latest/download/ABA-Setup.exe, which must keep working.
  extra_files:
    - glob: ./dist/installer/ABA-Setup.exe
  header: |
    ## A Better Antivirus {{ .Tag }}

    > It's not an antivirus. It's a better one.

    Plants fake passwords, wallets and app data that only an infostealer would read, and freezes
    whatever touches them. [abetterantivirus.com](https://abetterantivirus.com)

    **Windows 10/11** (x64 and ARM): download `ABA-Setup.exe` below, double-click it and follow the steps.
    Or in PowerShell (downloads this release, checks its signature and hash, runs the guided setup):
    ```powershell
    irm https://raw.githubusercontent.com/vulnix0x4/a-better-antivirus/main/install.ps1 | iex
    ```

    **macOS 14 or newer** (early; Apple silicon and Intel): download `ABA-macOS.pkg` below. It's signed and
    notarized by Apple. ABA needs Full Disk Access: switch it on for "File Access Monitor" in System Settings.

    **Linux** (early; needs systemd): checks the release's signature, then runs the setup:
    ```sh
    curl -fsSL https://raw.githubusercontent.com/vulnix0x4/a-better-antivirus/main/install.sh | sh
    ```
    or use the `.deb`, `.rpm` or tarball below.

    Then try it safely with `aba test`. Already installed with automatic updates on? You'll get
    this version within a day, or run `aba update` now. What's new: [CHANGELOG.md](https://github.com/vulnix0x4/a-better-antivirus/blob/main/CHANGELOG.md).

    [Watch it catch a real Discord token stealer (47 s video)](https://github.com/vulnix0x4/a-better-antivirus/blob/main/docs/demo.mp4)
  footer: |
    **Verify a manual download** before running it:
    ```powershell
    (Get-FileHash .\ABA-Setup.exe -Algorithm SHA256).Hash
    ```
    and compare with `SHA256SUMS.txt` (the same goes for `aba_{{ .Tag }}_windows_amd64.exe`; `ABA-Setup.exe` holds
    exactly the two `aba_{{ .Tag }}_windows_*.exe` files and installs the one for your PC). `SHA256SUMS.txt.sig` is the ed25519 signature the auto-updater checks
    before installing anything. Releases aren't code-signed yet, so Windows SmartScreen may warn: click
    "More info" → "Run anyway" only if the hash matches.

changelog:
  use: github
