version: 2

project_name: a-better-antivirus

builds:
  - id: aba
    main: ./cmd/aba
    binary: aba
    env: [CGO_ENABLED=0]
    goos: [windows]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags: ["-s -w -X main.version={{.Tag}}"]

archives:
  # Plain .exe downloads: the simplest thing to double-click.
  - id: exe
    formats: [binary]
    name_template: "aba_{{ .Tag }}_windows_{{ .Arch }}"
  - id: zip
    formats: [zip]
    name_template: "aba_{{ .Tag }}_windows_{{ .Arch }}"
    files: [README.md, LICENSE]

checksum:
  name_template: "SHA256SUMS.txt"
  algorithm: sha256

# Sign the checksum list with the release key (ed25519). ABA's auto-updater
# refuses any release whose SHA256SUMS.txt signature doesn't verify.
signs:
  - id: checksums
    artifacts: checksum
    cmd: go
    args: ["run", "./scripts/sign", "${artifact}", "${signature}"]
    signature: "${artifact}.sig"
    env:
      - ABA_SIGNING_KEY={{ .Env.ABA_SIGNING_KEY }}

release:
  header: |
    ## A Better Antivirus {{ .Tag }}

    > It's not an antivirus. It's a better one.

    Plants fake passwords, wallets and app data that only malware would read, and freezes
    whatever touches them. Windows 10/11, 64-bit.

    **Install:** download `aba_{{ .Tag }}_windows_amd64.exe`, check its hash (below), then run
    `.\aba_{{ .Tag }}_windows_amd64.exe install` (it asks for admin). Try it with `aba test`.

    Highlights: instant freeze (caught ~0.1 s after opening a bait), decoys for 18 apps,
    phone alerts (ntfy, Discord, Pushover, email), strict-mode network isolation, canary
    tokens, learning mode, full uninstall.
  footer: |
    **Verify your download** before running it:
    ```powershell
    (Get-FileHash .\aba_{{ .Tag }}_windows_amd64.exe -Algorithm SHA256).Hash
    ```
    and compare with `SHA256SUMS.txt`. Releases aren't code-signed yet, so Windows SmartScreen
    will warn: click "More info" → "Run anyway" only if the hash matches.

changelog:
  use: github
