version: 2

project_name: a-better-antivirus

builds:
  - id: aba
    main: ./cmd/aba
    binary: aba
    env: [CGO_ENABLED=0]
    goos: [windows]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags: ["-s -w -X main.version={{.Tag}}"]

archives:
  # Plain .exe downloads: the simplest thing to double-click.
  - id: exe
    formats: [binary]
    name_template: "aba_{{ .Tag }}_windows_{{ .Arch }}"
  - id: zip
    formats: [zip]
    name_template: "aba_{{ .Tag }}_windows_{{ .Arch }}"
    files: [README.md, LICENSE]

checksum:
  name_template: "SHA256SUMS.txt"
  algorithm: sha256

# Sign the checksum list with the release key (ed25519). ABA's auto-updater
# refuses any release whose SHA256SUMS.txt signature doesn't verify.
signs:
  - id: checksums
    artifacts: checksum
    cmd: go
    args: ["run", "./scripts/sign", "${artifact}", "${signature}"]
    signature: "${artifact}.sig"

release:
  header: |
    ## A Better Antivirus {{ .Tag }}

    > It's not an antivirus. It's a better one.

    Plants fake passwords, wallets and app data that only malware would read, and freezes
    whatever touches them. Windows 10/11, 64-bit (x64 and ARM).

    **Install** (PowerShell; downloads this release, checks its hash, runs the guided setup):
    ```powershell
    irm https://raw.githubusercontent.com/vulnix0x4/a-better-antivirus/main/install.ps1 | iex
    ```
    Then try it safely with `aba test`. Already installed with automatic updates on? You'll get
    this version within a day, or run `aba update` now. What's new: [CHANGELOG.md](https://github.com/vulnix0x4/a-better-antivirus/blob/main/CHANGELOG.md).

    [Watch it catch a real Discord token stealer (47 s video)](https://github.com/vulnix0x4/a-better-antivirus/blob/main/docs/demo.mp4)
  footer: |
    **Verify a manual download** before running it:
    ```powershell
    (Get-FileHash .\aba_{{ .Tag }}_windows_amd64.exe -Algorithm SHA256).Hash
    ```
    and compare with `SHA256SUMS.txt`. `SHA256SUMS.txt.sig` is the ed25519 signature the auto-updater checks
    before installing anything. Releases aren't code-signed yet, so Windows SmartScreen may warn: click
    "More info" → "Run anyway" only if the hash matches.

changelog:
  use: github
