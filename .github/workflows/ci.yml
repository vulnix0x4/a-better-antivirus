name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Vet
        run: go vet ./...

      - name: Unit tests
        run: go test ./...

      # GitHub's Windows runners are elevated, so we can test the real thing:
      # audit rules, the Security log and WFP filters.
      - name: Integration tests (admin)
        env:
          ABA_INTEGRATION: "1"
        run: go test -count=1 -v ./internal/integration/

      - name: Build
        run: |
          go build -ldflags "-s -w -X main.version=ci-${{ github.sha }}" -o dist/aba.exe ./cmd/aba
          go build -o dist/medium.exe ./scripts/medium
          go build -o dist/ghost.exe ./scripts/ghost

      # Every feature on a throwaway machine: install, fake stealers, freeze,
      # block, kill, resume+ignore, release, strict-mode isolation with a phone
      # alert sent while isolated, bait repair, evasion tricks, uninstall.
      - name: End-to-end
        shell: pwsh
        run: ./scripts/e2e.ps1 -Aba ./dist/aba.exe -Medium ./dist/medium.exe -Ghost ./dist/ghost.exe

  # Linux and macOS: everything that builds there. Until their backends are
  # written that's the OS-neutral core plus stubs, so this mostly guards the
  # boundary (see "Platforms" in CONTRIBUTING.md). CGO stays off, like in the
  # release builds.
  test-unix:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Vet
        run: go vet ./...

      - name: Unit tests
        run: go test ./...

      - name: Build
        run: go build -o dist/aba ./cmd/aba
