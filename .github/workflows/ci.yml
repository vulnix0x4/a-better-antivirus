name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Vet
        run: go vet ./...

      - name: Unit tests
        run: go test ./...

      # Our patched copy of the WFP library is a module of its own, which
      # ./... above doesn't reach.
      - name: Unit tests (third_party/wf)
        working-directory: third_party/wf
        run: go test -count=1 ./...

      # GitHub's Windows runners are elevated, so we can test the real thing:
      # audit rules, the Security log and WFP filters.
      - name: Integration tests (admin)
        env:
          ABA_INTEGRATION: "1"
        run: go test -count=1 -v ./internal/integration/

      - name: Build
        run: |
          go build -ldflags "-s -w -X main.version=ci-${{ github.sha }}" -o dist/aba.exe ./cmd/aba
          go build -o dist/medium.exe ./scripts/medium
          go build -o dist/ghost.exe ./scripts/ghost

      # Every feature on a throwaway machine: install, fake stealers, freeze,
      # block, kill, resume+ignore, release, strict-mode isolation with a phone
      # alert sent while isolated, bait repair, evasion tricks, uninstall.
      - name: End-to-end
        shell: pwsh
        run: ./scripts/e2e.ps1 -Aba ./dist/aba.exe -Medium ./dist/medium.exe -Ghost ./dist/ghost.exe

  # Linux and macOS: everything that builds there, then the real thing, like
  # the Windows job. GitHub's Linux runners have passwordless sudo, a real
  # kernel and systemd; its macOS runners have passwordless sudo and System
  # Integrity Protection off, so ABA can be given Full Disk Access there
  # without a person clicking. CGO stays off, like in the release builds.
  test-unix:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Vet
        run: go vet ./...

      - name: Unit tests
        run: go test ./...

      # As root: fanotify permission events, the cgroup freezer, the package
      # database, planting with the user's rights. The test binaries are built
      # as the runner's user and play the fake stealer as that user.
      - name: Integration tests (root)
        if: runner.os == 'Linux'
        run: |
          sudo loginctl enable-linger "$USER" || true
          go test -c -o dist/integration.test ./internal/integration
          go test -c -o dist/baits.test ./internal/baits
          sudo env ABA_INTEGRATION=1 ABA_TEST_USER="$USER" ./dist/integration.test -test.v -test.count=1
          sudo env ABA_INTEGRATION=1 ABA_TEST_USER="$USER" ./dist/baits.test -test.v -test.count=1 -test.run 'Linux|Planting'

      - name: Build
        run: go build -o dist/aba ./cmd/aba

      - name: Build for the end-to-end run
        if: runner.os == 'Linux'
        run: |
          go build -ldflags "-s -w -X main.version=ci-${{ github.sha }}" -o dist/aba ./cmd/aba
          go build -o dist/grabber ./scripts/grabber

      # Every feature on a throwaway machine: install as a systemd service,
      # fake stealers frozen inside their open, kill, legitimate readers let
      # through, resume, trust, release, a sweep, a hard-link trick, bait
      # repair, uninstall, and nothing left behind.
      - name: End-to-end
        if: runner.os == 'Linux'
        run: bash scripts/e2e-linux.sh ./dist/aba ./dist/grabber

      # The release build for macOS, as the release workflow makes it, but
      # nothing published or signed.
      - name: Release build (macOS)
        if: runner.os == 'macOS'
        uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --snapshot --clean --skip=publish,sign --config .goreleaser-macos.yaml

      - name: Build for the end-to-end run (macOS)
        if: runner.os == 'macOS'
        run: |
          go build -ldflags "-s -w -X main.version=ci-${{ github.sha }}" -o dist/aba ./cmd/aba
          go build -o dist/grabber ./scripts/grabber

      # Every feature on a throwaway Mac: install as a launchd daemon with Full
      # Disk Access, fake stealers frozen, kill, a tool let through, resume,
      # trust, release, a sweep, a hard-link trick, a copy made through
      # Finder, Strict mode's isolation, uninstall, nothing left behind.
      - name: End-to-end (macOS)
        if: runner.os == 'macOS'
        timeout-minutes: 15
        run: bash scripts/e2e-macos.sh ./dist/aba ./dist/grabber

      - name: Service log (after a failure, macOS)
        if: failure() && runner.os == 'macOS'
        run: |
          sudo tail -n 300 "/Library/Application Support/File Access Monitor/Data/service.log" || true
          sudo cat "/Library/Application Support/File Access Monitor/Data/crash.log" || true
          sudo log show --last 10m --predicate 'process == "tccd"' --style compact | grep -i fileaccessmonitor | tail -40 || true

      - name: Service log (after a failure)
        if: failure() && runner.os == 'Linux'
        run: |
          sudo tail -n 300 /var/lib/file-access-monitor/service.log || true
          sudo cat /var/lib/file-access-monitor/crash.log || true
          sudo journalctl -u file-access-monitor.service -n 200 --no-pager || true
