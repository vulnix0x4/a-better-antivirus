name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Vet
        run: go vet ./...

      - name: Unit tests
        run: go test ./...

      # GitHub's Windows runners are elevated, so we can test the real thing:
      # audit rules, the Security log and WFP filters.
      - name: Integration tests (admin)
        env:
          ABA_INTEGRATION: "1"
        run: go test -count=1 -v ./internal/integration/

      - name: Build
        run: go build -ldflags "-s -w -X main.version=ci-${{ github.sha }}" -o dist/aba.exe ./cmd/aba

      # Every feature on a throwaway machine: install, fake stealers, freeze,
      # block, kill, resume+ignore, release, strict-mode isolation with a phone
      # alert sent while isolated, bait repair, decoy retirement, uninstall.
      - name: End-to-end
        shell: pwsh
        run: ./scripts/e2e.ps1 -Aba ./dist/aba.exe
