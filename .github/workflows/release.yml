name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    # The "release" environment holds what Windows code signing needs (see
    # docs/windows-signing.md). Only jobs in it can sign: that is what Azure
    # checks GitHub's sign-in token for.
    environment: release
    permissions:
      contents: write
      id-token: write # the sign-in token for Azure; no password is stored
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go test ./...
      # ABA-Setup.exe is compiled with Inno Setup, from GoReleaser's build hook
      # (see .goreleaser.yaml). This fetches one fixed version of the compiler,
      # checks its SHA-256 and sets ISCC for the next step.
      - name: Get the Inno Setup compiler
        shell: pwsh
        run: ./installer/get-inno.ps1
      # Code signing (Authenticode) of every Windows program, with Microsoft's
      # Artifact Signing service, only when the repository variable
      # ABA_CODE_SIGNING is "on" and the signing settings are there.
      # GoReleaser's build step then signs each aba.exe and ABA-Setup.exe
      # before anything is zipped, hashed or published (see installer/build).
      # Otherwise these steps are skipped and the release is built unsigned.
      # Signing is off: a certificate shows the signer's legal name and town
      # in every file's properties (docs/windows-signing.md).
      - name: Sign in to Azure (code signing)
        if: vars.ABA_CODE_SIGNING == 'on' && vars.ARTIFACT_SIGNING_ACCOUNT != ''
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true
      - name: Get .NET for the signing client (code signing)
        if: vars.ABA_CODE_SIGNING == 'on' && vars.ARTIFACT_SIGNING_ACCOUNT != ''
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"
      - name: Set up code signing
        if: vars.ABA_CODE_SIGNING == 'on' && vars.ARTIFACT_SIGNING_ACCOUNT != ''
        shell: pwsh
        run: ./scripts/setup-windows-signing.ps1 -Mode artifact-signing
        env:
          ARTIFACT_SIGNING_ENDPOINT: ${{ vars.ARTIFACT_SIGNING_ENDPOINT }}
          ARTIFACT_SIGNING_ACCOUNT: ${{ vars.ARTIFACT_SIGNING_ACCOUNT }}
          ARTIFACT_SIGNING_PROFILE: ${{ vars.ARTIFACT_SIGNING_PROFILE }}
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ABA_SIGNING_KEY: ${{ secrets.ABA_SIGNING_KEY }}
      # The same checks the Installer workflow makes on every pull request, on
      # the files that were just published: ABA-Setup.exe is in the signed
      # SHA256SUMS.txt and holds the published aba.exe files. When signing is
      # on, also that every Windows program published has a valid signature.
      - name: Check the installer against the release
        shell: pwsh
        run: |
          if ($env:ABA_WINDOWS_SIGNING) { ./installer/verify.ps1 -Signed } else { ./installer/verify.ps1 }

  # The Linux files (.goreleaser-linux.yaml), added to the release the job
  # above made, with their own signed checksum list. Then the same checks the
  # CI run makes, on the files that were just published: the .deb installed,
  # set up and removed, and install.sh run against this copy of the release.
  linux:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean --config .goreleaser-linux.yaml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ABA_SIGNING_KEY: ${{ secrets.ABA_SIGNING_KEY }}
      - name: Check the packages and install.sh against the release
        run: bash scripts/packages-linux.sh dist-linux

  # The macOS files (scripts/release-macos.sh), added to the release the
  # job above made, with their own signed checksum list. Signed with ABA's
  # Developer ID certificates and notarized by Apple only when the repository
  # variable ABA_CODE_SIGNING is "on" (the certificates stay in the "release"
  # environment); unsigned otherwise, the .pkg included.
  macos:
    needs: release
    runs-on: macos-latest
    environment: release
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Build, sign, notarize and upload the macOS files
        run: bash scripts/release-macos.sh "${GITHUB_REF_NAME}" dist-macos --upload
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ABA_SIGNING_KEY: ${{ secrets.ABA_SIGNING_KEY }}
          MACOS_APP_CERT: ${{ vars.ABA_CODE_SIGNING == 'on' && secrets.MACOS_APP_CERT || '' }}
          MACOS_APP_CERT_PASSWORD: ${{ vars.ABA_CODE_SIGNING == 'on' && secrets.MACOS_APP_CERT_PASSWORD || '' }}
          MACOS_INSTALLER_CERT: ${{ vars.ABA_CODE_SIGNING == 'on' && secrets.MACOS_INSTALLER_CERT || '' }}
          MACOS_INSTALLER_CERT_PASSWORD: ${{ vars.ABA_CODE_SIGNING == 'on' && secrets.MACOS_INSTALLER_CERT_PASSWORD || '' }}
          NOTARY_KEY: ${{ secrets.NOTARY_KEY }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
