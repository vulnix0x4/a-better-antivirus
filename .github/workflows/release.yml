name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go test ./...
      # ABA-Setup.exe is compiled with Inno Setup, from GoReleaser's build hook
      # (see .goreleaser.yaml). This fetches one fixed version of the compiler,
      # checks its SHA-256 and sets ISCC for the next step.
      - name: Get the Inno Setup compiler
        shell: pwsh
        run: ./installer/get-inno.ps1
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ABA_SIGNING_KEY: ${{ secrets.ABA_SIGNING_KEY }}
      # The same checks the Installer workflow makes on every pull request, on
      # the files that were just published: ABA-Setup.exe is in the signed
      # SHA256SUMS.txt and holds the published aba.exe files.
      - name: Check the installer against the release
        shell: pwsh
        run: ./installer/verify.ps1

  # The Linux files (.goreleaser-linux.yaml), added to the release the job
  # above made, with their own signed checksum list. Then the same checks the
  # CI run makes, on the files that were just published: the .deb installed,
  # set up and removed, and install.sh run against this copy of the release.
  linux:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean --config .goreleaser-linux.yaml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ABA_SIGNING_KEY: ${{ secrets.ABA_SIGNING_KEY }}
      - name: Check the packages and install.sh against the release
        run: bash scripts/packages-linux.sh dist-linux
