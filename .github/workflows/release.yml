name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go test ./...
      # ABA-Setup.exe is compiled with Inno Setup, from GoReleaser's build hook
      # (see .goreleaser.yaml). This fetches one fixed version of the compiler,
      # checks its SHA-256 and sets ISCC for the next step.
      - name: Get the Inno Setup compiler
        shell: pwsh
        run: ./installer/get-inno.ps1
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ABA_SIGNING_KEY: ${{ secrets.ABA_SIGNING_KEY }}
      # The same checks the Installer workflow makes on every pull request, on
      # the files that were just published: ABA-Setup.exe is in the signed
      # SHA256SUMS.txt and holds the published aba.exe files.
      - name: Check the installer against the release
        shell: pwsh
        run: ./installer/verify.ps1

  # The macOS files (.goreleaser-macos.yaml), added to the release the job
  # above made, with their own signed checksum list. Then a check of what was
  # just built: the list matches the files, and the program runs.
  macos:
    needs: release
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean --config .goreleaser-macos.yaml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ABA_SIGNING_KEY: ${{ secrets.ABA_SIGNING_KEY }}
      - name: Check the macOS files
        run: |
          cd dist-macos
          shasum -a 256 -c SHA256SUMS-macos.txt
          test -s SHA256SUMS-macos.txt.sig
          ./aba_*_darwin_arm64 --version

