name: Bug report
description: Something doesn't work the way it should
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **Found a way to bypass or abuse ABA?** Please don't post it here: [report it privately](https://github.com/vulnix0x4/a-better-antivirus/security/advisories/new).
  - type: input
    id: version
    attributes:
      label: ABA version
      description: Output of `aba --version`
      placeholder: A Better Antivirus v0.2.0
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: Windows 11 24H2, 64-bit
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
  - type: textarea
    id: logs
    attributes:
      label: aba doctor output and the end of service.log
      description: '`aba doctor`, and the last ~50 lines of `C:\ProgramData\FileAccessMonitor\service.log`. Remove anything private.'
      render: text
